<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio Knowledge Search</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Layout ─────────────────────────────────────────────── */
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e2e2f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      padding: 14px 20px;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
    #header p  { font-size: 12px; color: #555; margin-top: 2px; }

    /* ── Messages ───────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; gap: 10px; max-width: 88%; }
    .msg.user      { align-self: flex-end;   flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0; margin-top: 3px;
    }
    .msg.user .avatar      { background: #3b5bdb; color: #fff; }
    .msg.assistant .avatar { background: #1e1e2e; color: #888; border: 1px solid #2a2a3a; }

    .bubble {
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #3b5bdb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: #1a1a28;
      border: 1px solid #2a2a3a;
      border-bottom-left-radius: 4px;
    }

    /* ── Thinking indicator ─────────────────────────────────── */
    .thinking { color: #444; font-style: italic; font-size: 13px; }

    /* ── Sources ────────────────────────────────────────────── */
    .meta { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }

    .toggle-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #555;
      cursor: pointer; user-select: none;
      padding: 2px 0;
    }
    .toggle-row:hover { color: #888; }
    .toggle-icon { font-size: 10px; transition: transform 0.15s; }
    .toggle-icon.open { transform: rotate(90deg); }

    .collapsible { display: none; margin-top: 4px; }
    .collapsible.open { display: block; }

    .sources-list {
      border-left: 2px solid #2a2a3a;
      padding-left: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .source-item {}
    .source-path    { font-size: 11px; color: #6b82ff; font-family: monospace; }
    .source-chunk   { font-size: 10px; color: #444; }
    .source-snippet { font-size: 11px; color: #555; margin-top: 2px; line-height: 1.4; }

    .queries-list { display: flex; flex-direction: column; gap: 3px; padding-left: 12px; }
    .query-item          { font-size: 11px; color: #444; }
    .query-item.original { color: #666; }

    /* ── Input area ─────────────────────────────────────────── */
    #input-area {
      padding: 14px 20px;
      border-top: 1px solid #1e1e2e;
      display: flex; gap: 10px; align-items: flex-end;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      background: #1a1a28;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e2e2f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
    }
    #input:focus { border-color: #3b5bdb; }
    #input::placeholder { color: #333; }

    #send-btn {
      background: #3b5bdb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      height: 42px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #4c6ef5; }
    #send-btn:disabled { background: #1e1e2e; color: #333; cursor: not-allowed; }

    /* ── Scrollbar ───────────────────────────────────────────── */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
  </style>
</head>
<body>

<div id="header">
  <h1>AI Studio Knowledge Search</h1>
  <p>Ask anything about the repo — code, agents, pricing, pipeline, wiki.</p>
</div>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" placeholder="Ask about the repo… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────
  const API_BASE = "http://localhost:8000";

  // ── DOM refs ────────────────────────────────────────────────
  const msgsEl   = document.getElementById("messages");
  const inputEl  = document.getElementById("input");
  const sendBtn  = document.getElementById("send-btn");

  // ── Helpers ─────────────────────────────────────────────────
  function scrollBottom() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function makeAvatar(role) {
    const el = document.createElement("div");
    el.className = "avatar";
    el.textContent = role === "user" ? "U" : "AI";
    return el;
  }

  function addMessage(role, text = "") {
    const wrap   = document.createElement("div");
    wrap.className = `msg ${role}`;
    const avatar = makeAvatar(role);
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (text) bubble.textContent = text;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgsEl.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  function buildToggle(label) {
    const row  = document.createElement("div");
    row.className = "toggle-row";
    const icon = document.createElement("span");
    icon.className = "toggle-icon";
    icon.textContent = "▶";
    const txt = document.createElement("span");
    txt.textContent = label;
    row.appendChild(icon);
    row.appendChild(txt);
    return { row, icon, txt };
  }

  function appendMeta(bubble, sources, queries) {
    const meta = document.createElement("div");
    meta.className = "meta";

    // Sources
    if (sources.length > 0) {
      const { row, icon } = buildToggle(`${sources.length} source document${sources.length !== 1 ? "s" : ""}`);
      const body = document.createElement("div");
      body.className = "collapsible";
      const list = document.createElement("div");
      list.className = "sources-list";
      sources.forEach((s, i) => {
        const item = document.createElement("div");
        item.className = "source-item";
        item.innerHTML =
          `<div class="source-path">[${i + 1}] ${s.path}</div>` +
          `<div class="source-chunk">chunk ${s.chunk}</div>` +
          `<div class="source-snippet">${s.snippet}</div>`;
        list.appendChild(item);
      });
      body.appendChild(list);
      row.addEventListener("click", () => {
        const open = body.classList.toggle("open");
        icon.classList.toggle("open", open);
      });
      meta.appendChild(row);
      meta.appendChild(body);
    }

    // Augmented queries
    if (queries.length > 1) {
      const { row, icon } = buildToggle(`${queries.length} augmented queries`);
      const body = document.createElement("div");
      body.className = "collapsible";
      const list = document.createElement("div");
      list.className = "queries-list";
      queries.forEach((q, i) => {
        const item = document.createElement("div");
        item.className = `query-item${i === 0 ? " original" : ""}`;
        item.textContent = `${i === 0 ? "▸ " : "  "}${q}${i === 0 ? " (original)" : ""}`;
        list.appendChild(item);
      });
      body.appendChild(list);
      row.addEventListener("click", () => {
        const open = body.classList.toggle("open");
        icon.classList.toggle("open", open);
      });
      meta.appendChild(row);
      meta.appendChild(body);
    }

    if (meta.children.length > 0) bubble.appendChild(meta);
  }

  // ── Send ─────────────────────────────────────────────────────
  async function sendMessage() {
    const query = inputEl.value.trim();
    if (!query || sendBtn.disabled) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", query);

    const bubble = addMessage("assistant");
    bubble.classList.add("thinking");
    bubble.textContent = "Retrieving context…";

    let text = "";
    let meta = null;

    try {
      const resp = await fetch(`${API_BASE}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });

      if (!resp.ok) {
        throw new Error(`Server returned ${resp.status}`);
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buf     = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          if (event.type === "meta") {
            meta = event;
            bubble.classList.remove("thinking");
            bubble.textContent = "";
          } else if (event.type === "token") {
            text += event.content;
            bubble.textContent = text;
            scrollBottom();
          } else if (event.type === "done") {
            if (meta) appendMeta(bubble, meta.sources, meta.queries);
          }
        }
      }
    } catch (err) {
      bubble.classList.remove("thinking");
      bubble.textContent =
        `Connection error: ${err.message}\n\nMake sure the API server is running:\n  python -m scripts.rag.api_server`;
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Events ───────────────────────────────────────────────────
  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  inputEl.focus();
</script>
</body>
</html>
