[project]
name = "deepagents-gcal"
version = "0.1.0"
description = "A LangChain deepagents agent with Google Calendar tools — reusable Python package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Studio Accademia Milano" }]
keywords = ["langchain", "deepagents", "langgraph", "google-calendar", "agent", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "deepagents>=0.7,<0.8",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.7",
    "google-api-python-client>=2.120",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
deepagents-gcal = "deepagents_gcal.cli:main"

[project.urls]
Homepage = "https://github.com/laceto/AIstudioAccademiaMilano"
Source = "https://github.com/laceto/AIstudioAccademiaMilano/tree/main/deliverables/2026-09-16_034_deepagents-gcal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_gcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
