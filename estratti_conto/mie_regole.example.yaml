# Esempio di regole personali: copialo in mie_regole.yaml (che resta fuori da git) e metti i tuoi nomi.
# Si aggiungono alle regole di base (bankanalyst/rules.yaml): queste categorie vengono provate per prime.

overrides:
  # frammento della descrizione: categoria (vince su tutto)
  'nome del nido': Famiglia e istruzione
  'nome venditore': 'Casa: acquisto, lavori, notaio'

categories:
  - name: Giroconti tra conti            # bonifici a te stesso: esclusi da entrate e uscite
    patterns: ['a favore di (mario rossi|rossi mario)', 'anagrafica ordinante rossi mario']

  - name: Contributi familiari           # bonifici di un familiare per le spese di casa
    direction: in
    patterns: ['ordinante anna bianchi']

  - name: Ristoranti e bar               # esercenti abituali che le regole di base non conoscono
    patterns: ['bar sotto casa']
