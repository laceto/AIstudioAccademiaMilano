# Build the mailagent tidy image (mailagent/Dockerfile) from the repo root.
#
# The repo holds several Dockerfiles and a default source build picks the wrong one, so the
# Dockerfile is named explicitly.
#
#   gcloud builds submit --config deploy/cloudbuild.mailagent.yaml \
#     --substitutions _IMAGE=europe-west8-docker.pkg.dev/$PROJECT/aistudio/mailagent
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "mailagent/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
