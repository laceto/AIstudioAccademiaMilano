name: RAG Bootstrap

# Manual: trigger from the Actions tab whenever the index needs a fresh full rebuild.
# Auto:   fires once when this workflow file itself is pushed to main, so the
#         vectorstore is populated immediately after merge.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-bootstrap.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-rag.txt

      - name: Install RAG dependencies
        run: pip install -r requirements-rag.txt

      - name: Guard — OPENAI_API_KEY must be set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set in repo secrets — embed_repo has no local fallback path"
            exit 1
          fi

      - name: Build FAISS index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.rag.embed_repo

      - name: Commit vectorstore + registry back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vectorstore/repo/ data/rag_registry.tsv
          if git diff --staged --quiet; then
            echo "Nothing to commit — index is already current"
          else
            git commit -m "rag: bootstrap vectorstore $(date +%Y-%m-%d) [skip ci]"
            git push
          fi
