name: RAG Bootstrap

# Manual: trigger from the Actions tab whenever the index needs a fresh full rebuild.
# Auto:   fires once when this workflow file itself is pushed to main, so the
#         vectorstore is populated immediately after merge.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-bootstrap.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-rag.txt

      - name: Install RAG dependencies
        run: pip install -r requirements-rag.txt

      - name: Guard — OPENAI_API_KEY must be set
        id: guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY not set in repo secrets — skipping bootstrap. Add it at Settings > Secrets > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build FAISS index
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.rag.embed_repo

      - name: Commit vectorstore + registry back to main
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vectorstore/repo/ data/rag_registry.tsv
          if git diff --staged --quiet; then
            echo "Nothing to commit — index is already current"
          else
            BRANCH="ops/rag-bootstrap-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "rag: bootstrap vectorstore $(date +%Y-%m-%d) [skip ci]"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "rag: bootstrap vectorstore $(date +%Y-%m-%d)" \
              --body "Auto-generated RAG index update from bootstrap workflow.")
            gh pr merge "$PR_URL" --merge --admin
          fi
