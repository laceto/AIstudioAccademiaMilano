name: Studio Ops

on:
  push:
    branches: [main]
    paths:
      - 'process/audit/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  learning-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run learning loop
        run: |
          python scripts/learning_loop.py \
            --event delivery_complete \
            --audit-dir process/audit \
            --settings config/global_settings.json \
            --no-commit

      - name: Commit updated settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/global_settings.json
          if git diff --staged --quiet; then
            echo "No settings changes — nothing to commit."
          else
            BRANCH="ops/learn-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "learn: update global settings from delivery [skip ci]"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "learn: update global settings [auto]" \
              --body "Automated settings update from Studio Ops learning loop.")
            gh pr merge "$PR_URL" --squash --admin
          fi
