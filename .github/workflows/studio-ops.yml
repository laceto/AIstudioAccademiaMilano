name: Studio Ops

on:
  push:
    branches: [main]
    paths:
      - 'process/audit/**'
  workflow_dispatch:

jobs:
  learning-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run learning loop
        run: |
          python scripts/learning_loop.py \
            --event delivery_complete \
            --audit-dir process/audit \
            --settings config/global_settings.json \
            --no-commit

      - name: Commit updated settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/global_settings.json
          git diff --staged --quiet || git commit -m "learn: update global settings from delivery [skip ci]"
          git push
