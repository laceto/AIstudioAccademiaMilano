name: AI Studio Pipeline

# Two triggers:
#   1. workflow_dispatch  — Luigi runs it manually from the Actions tab
#   2. issues.opened      — any new issue body becomes the pipeline request

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Client request (what to build)"
        required: true
        default: "Create a Streamlit chatbot with OpenAI streaming"
      user_name:
        description: "Client name"
        required: false
        default: "Luigi"
      user_email:
        description: "Client email (optional — leave blank to skip email)"
        required: false
        default: ""
      provider:
        description: "LLM provider"
        required: false
        default: "openai"
        type: choice
        options: [openai, anthropic]

  issues:
    types: [opened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Francesca needs to commit + push
      issues: write     # post result comment on the triggering issue

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Python ────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies
        run: |
          pip install \
            "langgraph>=0.2.0" \
            "langchain>=0.2.0" \
            "langchain-core>=0.2.0" \
            "langchain-anthropic>=0.1.0" \
            "langchain-openai>=0.1.0" \
            "fpdf2>=2.7"

      # ── Git identity (Francesca's commit needs an author) ─────────────
      - name: Configure git identity
        run: |
          git config user.email "pipeline[bot]@aistudio.accademia"
          git config user.name "AI Studio Pipeline"

      # ── Create a deliverable branch so Francesca doesn't push to main ─
      - name: Create deliverable branch
        id: branch
        run: |
          BRANCH="pipeline/$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── Resolve inputs (dispatch vs issue trigger) ─────────────────────
      - name: Resolve pipeline inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQUEST: ${{ inputs.request }}
          DISPATCH_USER: ${{ inputs.user_name }}
          DISPATCH_EMAIL: ${{ inputs.user_email }}
          DISPATCH_PROVIDER: ${{ inputs.provider }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "request=$ISSUE_BODY"       >> "$GITHUB_OUTPUT"
            echo "user_name=$ISSUE_USER"     >> "$GITHUB_OUTPUT"
            echo "user_email="               >> "$GITHUB_OUTPUT"
            echo "provider=openai"            >> "$GITHUB_OUTPUT"
          else
            echo "request=$DISPATCH_REQUEST" >> "$GITHUB_OUTPUT"
            echo "user_name=$DISPATCH_USER"  >> "$GITHUB_OUTPUT"
            echo "user_email=$DISPATCH_EMAIL" >> "$GITHUB_OUTPUT"
            echo "provider=$DISPATCH_PROVIDER" >> "$GITHUB_OUTPUT"
          fi

      # ── Run the pipeline ───────────────────────────────────────────────
      - name: Run AI Studio pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/run_pipeline_cli.py \
            --request    "${{ steps.inputs.outputs.request }}" \
            --user-name  "${{ steps.inputs.outputs.user_name }}" \
            --user-email "${{ steps.inputs.outputs.user_email }}" \
            --provider   "${{ steps.inputs.outputs.provider }}"

      # ── Post issue comment with result ─────────────────────────────────
      - name: Comment result on issue
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status    = '${{ steps.pipeline.outputs.status }}';
            const path      = '${{ steps.pipeline.outputs.deliverable_path }}';
            const price     = '${{ steps.pipeline.outputs.price_eur }}';
            const escalated = '${{ steps.pipeline.outputs.escalated }}' === 'true';
            const branch    = '${{ steps.branch.outputs.name }}';
            const runUrl    = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (status === 'delivered') {
              body = [
                '## ✅ AI Studio — Deliverable Ready',
                '',
                `| Field | Value |`,
                `|-------|-------|`,
                `| Status | \`delivered\` |`,
                `| File | \`${path}\` |`,
                `| Price | €${price} |`,
                `| Branch | \`${branch}\` |`,
                `| Run | [View logs](${runUrl}) |`,
                '',
                '_Francesca committed the deliverable to the branch above. Open a PR to merge._',
              ].join('\n');
            } else if (escalated) {
              body = [
                '## ⚠️ AI Studio — Escalated to Luigi',
                '',
                'The pipeline could not price this request automatically.',
                `[View run logs](${runUrl}) for details.`,
              ].join('\n');
            } else {
              body = [
                '## ❌ AI Studio — Pipeline Failed',
                '',
                `[View run logs](${runUrl}) for details.`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
