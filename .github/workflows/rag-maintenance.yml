name: RAG Maintenance

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — before research pipeline at 07:00
  workflow_dispatch:

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-rag.txt

      - name: Install RAG dependencies
        run: pip install -r requirements-rag.txt

      - name: Check RAG scripts available
        id: rag_check
        run: |
          if [ -f scripts/rag/embed_repo.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "RAG scripts not on this branch yet — skipping rebuild"
          fi

      - name: Compute registry hash
        if: steps.rag_check.outputs.available == 'true'
        id: registry
        run: |
          if [ -f data/rag_registry.tsv ]; then
            echo "hash=$(sha256sum data/rag_registry.tsv | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "hash=empty" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore vectorstore cache
        if: steps.rag_check.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: data/vectorstore/
          key: rag-vectorstore-${{ steps.registry.outputs.hash }}

      - name: Rebuild RAG index
        if: steps.rag_check.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            python -m scripts.rag.embed_repo --provider openai
          else
            python -m scripts.rag.embed_repo --provider local
          fi

      - name: Commit registry
        if: steps.rag_check.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rag_registry.tsv
          git diff --staged --quiet || git commit -m "rag: rebuild index $(date +%Y-%m-%d) [skip ci]"
          git push
