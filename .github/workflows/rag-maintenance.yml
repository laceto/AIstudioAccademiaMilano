name: RAG Maintenance
# Owner: RAG Team (agents/rag/README.md)
# Agents involved:
#   - Indexer      (scripts/rag/embed_repo.py)    — rebuilds FAISS + registry
#   - Retriever    (scripts/rag/retrieve_repo.py) — consumes index built here
#   - Synthesizer  (scripts/rag/synthesize.py)    — consumes index built here
#   - Context Injector (scripts/rag/inject_context.py) — always-on, reads live index
# Schedule: daily 06:00 UTC — runs before research pipeline (07:00 UTC)

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — before research pipeline at 07:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-rag.txt

      # RAG Team: Indexer — install embed dependencies
      - name: Install RAG dependencies
        run: pip install -r requirements-rag.txt

      # RAG Team: Indexer — guard: skip if embed_repo.py not yet on branch
      - name: Check RAG scripts available
        id: rag_check
        run: |
          if [ -f scripts/rag/embed_repo.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "RAG scripts not on this branch yet — skipping rebuild"
          fi

      # RAG Team: Indexer — hash registry to enable vectorstore cache hit
      - name: Compute registry hash
        if: steps.rag_check.outputs.available == 'true'
        id: registry
        run: |
          if [ -f data/rag_registry.tsv ]; then
            echo "hash=$(sha256sum data/rag_registry.tsv | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "hash=empty" >> "$GITHUB_OUTPUT"
          fi

      # RAG Team: Indexer — restore FAISS vectorstore from cache (skip re-embed if unchanged)
      - name: Restore vectorstore cache
        if: steps.rag_check.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: data/vectorstore/
          key: rag-vectorstore-${{ steps.registry.outputs.hash }}

      # RAG Team: Indexer — run embed_repo.py via kitai batch (async, 50% cheaper than sync OpenAI calls)
      # Script exits 0 gracefully when OPENAI_API_KEY is absent or nothing has changed.
      - name: Rebuild RAG index
        if: steps.rag_check.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.rag.embed_repo

      # RAG Team: Indexer — commit updated rag_registry.tsv so Retriever/Synthesizer/Injector pick it up
      - name: Commit registry
        if: steps.rag_check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rag_registry.tsv
          if git diff --staged --quiet; then
            echo "No registry changes — nothing to commit."
          else
            BRANCH="ops/rag-index-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git commit -m "rag: rebuild index $(date +%Y-%m-%d) [skip ci]"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "rag: daily index rebuild $(date +%Y-%m-%d)" \
              --body "Automated RAG registry update from daily maintenance workflow.")
            gh pr merge "$PR_URL" --squash --admin
          fi
