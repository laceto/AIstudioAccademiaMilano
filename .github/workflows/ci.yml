name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pyyaml fpdf2 numpy

      - name: Stable tests
        run: |
          pytest tests/test_retrieval.py \
            -v --tb=short

      - name: ISS tests (informational — allowed to fail)
        continue-on-error: true
        run: |
          pytest tests/test_iss002_intent_registry.py \
                 tests/test_iss003_credential_manager.py \
                 tests/test_iss004_templates.py \
                 tests/test_iss005_tiered_thresholds.py \
                 tests/test_iss006_source_citation.py \
                 tests/test_iss007_provider_agnostic_chatbot.py \
            -v --tb=short
