name: Digital Presence Pipeline

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC — weekly content drop
  workflow_dispatch:
    inputs:
      days:
        description: 'Activity look-back window (days)'
        required: false
        default: '7'
        type: string
      platforms:
        description: 'Auto-publish targets (comma-separated: telegram,twitter_x,discord)'
        required: false
        default: 'telegram'
        type: string
      dry_run:
        description: 'Dry run — generate post but skip publishing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit generated post back to repo
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install anthropic openai requests tweepy pyperclip
          pip install "git+https://github.com/laceto/kitai.git"

      - name: Check required secrets
        id: api_check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY set — will use kitai batch (gpt-4o, 50% cheaper)"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY absent — falling back to direct Anthropic API"
          else
            echo "::warning::Neither OPENAI_API_KEY nor ANTHROPIC_API_KEY set — skipping. Add at Settings > Secrets > Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve inputs
        if: steps.api_check.outputs.skip != 'true'
        id: cfg
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          PLATFORMS="${{ github.event.inputs.platforms || 'telegram' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "days=$DAYS"         >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN"   >> "$GITHUB_OUTPUT"

      - name: Run Digital Presence Pipeline
        if: steps.api_check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DRY_FLAG=""
          if [ "${{ steps.cfg.outputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/digital_presence_pipeline.py \
            --repo laceto/AIstudioAccademiaMilano \
            --days ${{ steps.cfg.outputs.days }} \
            --platforms ${{ steps.cfg.outputs.platforms }} \
            $DRY_FLAG

      - name: Commit generated post to repo
        if: steps.api_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add process/digital-presence/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            BRANCH="ops/digital-presence-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git commit -m "content: weekly LinkedIn post $(date +%Y-%m-%d) [skip ci]"
            git push origin "$BRANCH"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "content: weekly digital presence post $(date +%Y-%m-%d)" \
              --body "Auto-generated weekly digital presence post." \
              --auto-merge
          fi

      - name: Upload LinkedIn post as artifact
        if: steps.api_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post-${{ github.run_number }}
          path: process/digital-presence/*_linkedin_post.txt
          retention-days: 30
