# config/accounts_registry.yaml
# IT Staff agent's single source of truth for all studio platform accounts.
# NEVER store credential values here — only env var names and metadata.
# Owner: IT Staff agent. Luigi has final authority on all changes.
# Last updated: 2026-05-24

studio:
  name: AI Studio Accademia Milano
  founder: Luigi Aceto
  personal_email: luigi.vinegar@gmail.com
  business_email: luigi@aistudiomilano.xyz

domains:
  - domain: aistudiomilano.xyz
    registrar: Namecheap
    registered_by: Luigi
    registered_date: "2026-05-24"
    expiry_date: "2027-05-24"
    renewal_cost_eur: 1.72
    dns_provider: Cloudflare
    status: active
    iss_ref: ISS-013a
    notes: >
      Interim .xyz domain at €1.72/yr. PremiumDNS skipped — Cloudflare free tier
      provides equivalent DDoS protection, DNSSEC, and global anycast DNS.
      Upgrade path: register aistudiomilano.ai (~€60/yr) once Partita IVA is active (ISS-010).

dns:
  - provider: Cloudflare
    plan: free
    account_email: luigi.vinegar@gmail.com
    domains_managed:
      - aistudiomilano.xyz
    api_token_env: CLOUDFLARE_API_TOKEN
    api_token_permissions: "Zone:DNS:Edit"
    nameservers:
      - aaden.ns.cloudflare.com
      - cloe.ns.cloudflare.com
    status: active                 # Cloudflare live 2026-05-24 — traffic proxying confirmed
    iss_ref: "ISS-013b, ISS-013c, ISS-013d"
    notes: >
      ISS-013b done: Cloudflare account created + domain added 2026-05-24.
      ISS-013c done: Namecheap nameservers updated; traffic proxying confirmed.
      ISS-013d open: add CLOUDFLARE_API_TOKEN value to .env (Zone:DNS:Edit scope, aistudiomilano.xyz only).

email:
  - provider: Zoho Mail
    plan: paid
    mailboxes:
      - address: luigi@aistudiomilano.xyz
        type: primary_business
        status: active
    domain: aistudiomilano.xyz
    dns_records_status: active    # MX + SPF + DKIM auto-mapped via Zoho 2026-05-24
    api_key_env: ZOHO_API_KEY
    status: active
    iss_ref: ISS-013
    notes: Standalone Zoho mailbox, no forwarding. DNS auto-mapped by Zoho to Cloudflare.

hosting:
  - provider: Vercel
    plan: hobby
    account_email: luigi.vinegar@gmail.com
    used_for: static_landing_pages
    deploy_token_env: VERCEL_TOKEN
    status: active

  - provider: Streamlit Cloud
    plan: free
    account_email: luigi.vinegar@gmail.com
    used_for: streamlit_apps
    auth_method: github_oauth
    status: active

  - provider: Google Cloud Run
    plan: pay_as_you_go
    project_id: null             # fill from GCP console
    used_for: containerized_apps
    auth_env: GOOGLE_CREDENTIALS_JSON
    region: europe-west1
    status: active

version_control:
  - provider: GitHub
    username: laceto
    token_env: GITHUB_TOKEN
    scope: "repo, workflow"
    status: active

mcp_connectors:
  - provider: Google Calendar
    type: claude_ai_mcp
    account: luigi.vinegar@gmail.com
    status: active
    connected_date: "2026-05-24"

  - provider: Google Drive
    type: claude_ai_mcp
    account: luigi.vinegar@gmail.com
    status: active
    connected_date: "2026-05-24"

  - provider: Gmail
    type: claude_ai_mcp
    account: luigi.vinegar@gmail.com
    status: active
    connected_date: "2026-05-24"

  - provider: Slack
    type: claude_ai_mcp
    status: pending
    notes: Luigi to connect via /mcp → claude.ai Slack

  - provider: Supabase
    type: npm_mcp
    package: "@supabase/mcp-server-supabase"
    token_env: SUPABASE_ACCESS_TOKEN
    status: pending_credentials

  - provider: Vercel
    type: npm_mcp
    package: "@vercel/mcp-adapter"
    token_env: VERCEL_TOKEN
    status: pending_credentials

  - provider: Stripe
    type: npm_mcp
    package: "mcp-server-stripe"
    token_env: STRIPE_SECRET_KEY
    status: pending_credentials

  - provider: Twilio
    type: npm_mcp
    token_env: TWILIO_AUTH_TOKEN
    status: pending_credentials

  - provider: Tavily
    type: npm_mcp
    package: "mcp-server-tavily"
    token_env: TAVILY_API_KEY
    status: pending_credentials

  - provider: Hugging Face
    type: npm_mcp
    token_env: HUGGINGFACE_API_KEY
    status: pending_credentials
    notes: Free token from huggingface.co → Settings → Access Tokens (Read scope)

  - provider: n8n
    type: npm_mcp
    token_env: N8N_API_KEY
    status: pending_credentials

  - provider: Netlify
    type: npm_mcp
    token_env: NETLIFY_ACCESS_TOKEN
    status: pending_credentials

credential_policy:
  storage: env_var_only          # values never in registry or code
  session_ttl_sec: 3600          # credential_manager.py default
  oauth_tokens: session_scoped   # never persisted to disk
  api_keys: env_var_permanent    # set in shell profile or .env (gitignored)

expiry_monitoring:
  alert_days_before: 30
  responsible_agent: IT Staff
  escalation: Lorenzo files P1 issue automatically
