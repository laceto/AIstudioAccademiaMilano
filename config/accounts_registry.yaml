  - provider: Google Calendar
    type: claude_ai_mcp
    account: luigi.vinegar@gmail.com
    status: active
    connected_date: "2026-05-24"

  - provider: Google Drive
    type: claude_ai_mcp
    account: luigi.vinegar@gmail.com
    status: active
    connected_date: "2026-05-24"

  - provider: Gmail
    type: claude_ai_mcp
    account: luigi.vinegar@gmail.com
    status: active
    connected_date: "2026-05-24"

  - provider: Slack
    type: claude_ai_mcp
