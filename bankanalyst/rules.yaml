# Regole di classificazione (delivery 045). Vince la prima categoria che corrisponde, dall'alto.
# patterns: espressioni regolari, maiuscole/minuscole indifferenti, cercate nella descrizione.
# direction: in (solo entrate), out (solo uscite), any (default).
# amount: importo esatto con segno (es. -5.50): stesso esercente, significato diverso a seconda del prezzo.
# transfer: true → soldi spostati tra conti propri (anche verso conti di investimento): esclusi dai
#   totali entrate/uscite, così non sembrano né spese né guadagni.
# overrides: frammento di descrizione → categoria; vince su tutto.
#
# Queste sono le regole generiche. Quelle con nomi (il tuo nome sui giroconti, i tuoi esercenti abituali)
# vanno in un file personale passato con --rules: le sue categorie vengono controllate prima di queste e
# i suoi overrides si aggiungono. Tienilo fuori dal repo (es. estratti_conto/mie_regole.yaml).

overrides: {}

categories:
  - name: Giroconti tra conti
    transfer: true
    patterns: ['giroconto', 'giro ?conto', 'trasferimento (fondi|tra conti)', 'bonifico da ing', 'bonifico (a|verso) credem',
               'conto credem', 'conto arancio']

  - name: Rendite finanziarie
    direction: in
    patterns: ['cedol', 'dividend']

  - name: Commissioni e costi bancari   # before the investment rule: the stamp duty on a dossier is a cost
    patterns: ['imposta di bollo']

  - name: Investimenti e risparmio
    transfer: true
    patterns: ['titoli', '\bfondo\b', '\betf\b', 'dossier', '\bpac\b', 'conto deposito', 'directa',
               'fineco', 'degiro', 'trade republic', 'scalable', 'moneyfarm']

  - name: Stipendio e redditi
    direction: in
    patterns: ['stipendio', 'emolument', 'retribuzion', 'pensione', 'cedolino', 'compens', 'parcella', 'fattura n']

  - name: Assegni e contributi pubblici
    direction: in
    patterns: ['assegno unico', '\binps\b', 'bonus', 'contributo', 'naspi']

  - name: Affitto e mutuo
    patterns: ['affitto', 'canone (di )?locazione', 'mutuo', 'rata (finanziamento|prestito)']

  - name: 'Casa: acquisto, lavori, notaio'
    patterns: ['notai', 'notarile', 'rogito', 'compravendita', 'caparra', 'agenzia immobiliare', 'ristruttur', 'impresa edile']

  - name: Commissioni e costi bancari
    patterns: ['commission', '\bcomm\.', 'canone (gestione|mensile|conto)', 'rimborso canone', 'spese (tenuta|di gestione|conto)',
               'imposta di bollo', 'bolli c/c', '\bbollo\b', 'competenze (di chiusura|conto)', 'interessi debitori']

  - name: Carta di credito (addebito mensile)
    patterns: ['carta ego', 'saldo carta', 'addebito carta di credito', 'estratto conto carta', 'american express', 'nexi',
               'ricarica carta prepagata']

  - name: Altre entrate
    direction: in
    patterns: ['rimborso', 'storno', 'cashback', 'interessi creditori', 'riparto', 'regalo', 'bonifico (a vostro favore|da)',
               'accredito']

  - name: Assicurazioni
    patterns: ['assicuraz', 'unipol', 'generali', 'allianz', '\baxa\b', 'zurich', 'reale mutua', 'polizza', 'premio protezione',
               '\brca\b']

  - name: Casa e utenze
    patterns: ['enel', '\ba2a\b', '\bhera\b', 'iren', 'edison', 'eni plenitude', 'sorgenia', 'acea', 'metropolitana milanese',
               '\btim\b', 'telecom', 'vodafone', 'windtre', 'wind tre', 'iliad', 'fastweb', 'condominio', '\btari\b',
               'bolletta', 'telefonia', 'ikea', 'leroy merlin', 'brico', 'punto casa', 'colorificio',
               'acqua e sapone', 'ferrament']

  - name: Spesa alimentare
    patterns: ['esselunga', '\bcoop\b', 'conad', 'carrefour', '\bcrf\b', 'lidl', 'eurospin', '\bpam\b', '\bunes\b', '\biper\b',
               'il gigante', 'bennet', 'penny', 'aldi', 'tigros', '\bcrai\b', 'despar', 'eurospar', '\bspar\b', 'naturasi',
               'cortilia', 'supermerc', 'alimentari', 'frutteto', 'carni', 'butcher', 'pesce', 'raviolific', 'agricol',
               'punto spesa', 'panific', '\bforno\b', 'pescheria', 'pescaria', 'macelleria', 'formag', 'casaro', 'latte',
               'frutta', 'ortofrutt', 'dispens', 'gastronomia', 'no glutine', 'senza glutine']

  - name: Ristoranti e bar
    patterns: ['ristorant', 'trattoria', 'osteria', 'pizz', '\bbar\b', 'caff', 'cafe\b', 'pasticce', 'gelateri', 'panino', 'paninoteca',
               'food', 'cucina', 'sushi', 'kebab', 'chiosco', 'autogrill', 'menu', 'mc ?donald', 'burger king', 'deliveroo',
               'eataly', 'kitchen', 'piadin', 'rosticc', 'ristor', 'birr', 'dolcer', 'glaces', 'cafeth', 'mixology', 'venchi',
               'glovo', 'just ?eat', 'uber ?eats']

  - name: Tabacchi
    patterns: ['tabacc']

  - name: Trasporti e auto
    patterns: ['\beni\b', 'eni station', '\bq8\b', 'tamoil', '\besso\b', '\bagip\b', 'carburant', 'telepass', 'autostrad',
               '\beni\d+', 'trenitalia', '\bitalo\b', 'trenord', '\bfnm\b', '\batm\b milano', 'ticket atm', 'taxi', 'uber',
               'free ?now', 'distributore', 'area serv', 'carburanti', 'parcheggi', 'parking', 'parcometri', 'garage', 'direz\. ?(uscita|entrata)', 'norauto', 'speedy car',
               '\bads\b',
               'easypark', 'autolavagg', 'ryanair', 'easyjet', 'ita airwa', 'aeroporto', 'bollo auto', 'officina',
               'gommista']

  - name: Salute
    patterns: ['farmac', 'parafarm', 'sanitaria', 'ospedal', 'medic', 'dentist', 'ottic', 'analisi cliniche', 'poliambulator', 'clinic',
               'humanitas', 'c\.d\.i\.', 'centro diagnostico', 'diagnos', 'screening', 'fisioterap']

  - name: Cura personale e servizi
    patterns: ['parrucch', 'coiffeur', 'barbier', 'estetic', 'lavanderia', 'tintoria', 'sartoria', 'calzolai']

  - name: Abbonamenti e digitale
    patterns: ['netflix', 'spotify', 'amazon prime', 'disney', '\bdazn\b', '\bsky\b', 'now tv', 'apple\.com', 'itunes',
               'google', 'microsoft', 'openai', 'anthropic', 'claude\.ai', 'github', 'icloud', 'youtube', 'palestra',
               'abbonamento']

  - name: Shopping
    patterns: ['amazon', 'zalando', 'decathlon', 'h&m', '\bzara\b', 'mediaworld', 'unieuro', 'euronics', '\bebay\b', 'paypal',
               'shein', '\btemu\b', 'oviesse', '\bovs\b', 'upim', 'rinascente', '\bmoda\b', '\bnike\b', 'aw lab', 'foot ?locker',
               'calzatur', 'abbigliamento', 'amzn', 'intimissimi', 'tezenis', 'pittarosso', '\bmango\b', 'tiger store',
               'feltrinelli', 'mondadori']

  - name: Famiglia e istruzione
    patterns: ['scuola', 'asilo', '\bnido\b', 'mensa', 'retta', 'universit', 'libreria', 'giocattol', 'toys', 'prenatal',
               'bebe', 'chicco', 'giochi']

  - name: Tasse e F24
    patterns: ['\bf24\b', 'agenzia (delle )?entrate', 'imposta', '\btribut', 'pago ?pa', 'multa', 'contravvenzion',
               'regione lombardia']

  - name: Regali e donazioni
    direction: out
    patterns: ['regalo', 'auguri', 'donazion', 'beneficenza', 'onlus']

  - name: Viaggi e vacanze
    patterns: ['airbnb', 'booking\.com', 'expedia', 'hotel', '\bibis\b', 'novotel', '\blido\b', 'balneare', 'beach']

  - name: Svago e tempo libero
    patterns: ['cinema', '\buci\b', 'teatro', 'museo', 'pinacoteca', 'exhibition', 'mostra', 'concerto', 'ticketone',
               'vivaticket', 'luna ?park', 'palapark', 'piscina', 'milanosport', 'edicola']

  - name: Prelievi contanti
    patterns: ['prelievo', 'prelevamento', 'bancomat atm']

  - name: Bonifici in uscita
    direction: out
    patterns: ['bonifico', 'satispay', 'ricarica']
